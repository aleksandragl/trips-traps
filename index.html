<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trips-Traps-Trull Kaameratuvastus</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .board-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        video, canvas { border: 2px solid #333; border-radius: 8px; max-width: 100%; background: #000; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; margin-top: 10px; }
        .cell { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; border: 2px solid #ccc; background: #fff; border-radius: 6px; }
        .cell.x { background: #e3f2fd; color: #1976d2; }
        .cell.o { background: #fff3e0; color: #ef6c00; }
        .status { margin-top: 15px; font-weight: bold; }
        button { padding: 12px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
    <script>
      let player = null, c = null, g = null;
      let boardState = Array(9).fill("-");

      // 3x3 ruutudest tsoonide koordinaadid lõuendil (320x240)
      const gridCoords = [
        { x: 30,  y: 20  }, { x: 140, y: 20  }, { x: 250, y: 20  },
        { x: 30,  y: 90  }, { x: 140, y: 90  }, { x: 250, y: 90  },
        { x: 30,  y: 160 }, { x: 140, y: 160 }, { x: 250, y: 160 }
      ];

      function start() {
        player = document.getElementById("v1");
        c = document.getElementById("c1");
        g = c.getContext("2d");

        // Kaamera käivitamine (eelistab mobiilil tagumist kaamerat)
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { ideal: "environment" } } 
        }).then((stream) => {
          player.srcObject = stream;
        }).catch((err) => {
          alert("Kaamera viga: " + err);
        });

        setInterval(capture, 400); // Tuvastus iga 0.4 sekundi järel
      }

      function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, v = max;
        let d = max - min;
        s = max === 0 ? 0 : d / max;

        if (max === min) {
          h = 0;
        } else {
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
      }

      function capture() {
        if (!player || !player.videoWidth) return;

        g.drawImage(player, 0, 0, c.width, c.height);

        let newBoardState = [];

        gridCoords.forEach((coord, index) => {
          // Joonistame raami kaamera vaatlusala kohale
          g.strokeStyle = "#ff0000";
          g.lineWidth = 2;
          g.strokeRect(coord.x, coord.y, 40, 40);

          let d = g.getImageData(coord.x, coord.y, 40, 40);
          let r = 0, gr = 0, b = 0, count = 0;

          for (let i = 0; i < d.data.length; i += 4) {
            r  += d.data[i];
            gr += d.data[i + 1];
            b  += d.data[i + 2];
            count++;
          }
          r = Math.round(r / count);
          gr = Math.round(gr / count);
          b = Math.round(b / count);

          let hsv = rgbToHsv(r, gr, b);
          let symbol = "-";

          // Värvide tuvastus
          if (hsv.s > 30 && hsv.v > 20) {
            if (hsv.h >= 10 && hsv.h <= 45) {
              symbol = "O"; // Oranž = O
            } else if (hsv.h >= 180 && hsv.h <= 240) {
              symbol = "X"; // Sinine = X
            }
          }

          newBoardState.push(symbol);
        });

        updateBoardUI(newBoardState);
        boardState = newBoardState;
      }

      function updateBoardUI(state) {
        state.forEach((symbol, index) => {
          let cell = document.getElementById("cell-" + index);
          cell.innerText = symbol === "-" ? "" : symbol;
          cell.className = "cell " + (symbol === "X" ? "x" : symbol === "O" ? "o" : "");
        });
      }

      const SERVER_URL = "https://script.google.com/macros/s/AKfycbwsSSWgosceyT8KyOIICPZZ6y7povDQ3JC8767rH25yfq3YHl5sLpAaQtgQzvJz5nQG/exec";

      async function sendDataToServer() {
        const payload = {
          timestamp: new Date().toLocaleString("et-EE"),
          board: boardState,
          board_string: boardState.join(",")
        };

        const statusEl = document.getElementById("server-status");
        statusEl.innerText = "Saadan andmeid serverisse...";
        statusEl.style.color = "blue";

        try {
          let response = await fetch(SERVER_URL, {
            method: "POST",
            mode: "no-cors", // Vajalik Google Apps Scripti puhul
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          statusEl.innerText = "Mänguseis edukalt saadetud!";
          statusEl.style.color = "green";
        } catch (error) {
          statusEl.innerText = "Viga andmete saatmisel!";
          statusEl.style.color = "red";
          console.error(error);
        }
      }
    </script>
</head>
<body onload="start()">
    <div class="container">
        <h2>Trips-Traps-Trull Kaameratuvastus</h2>

        <div class="board-container">
            <div>
                <video id="v1" autoplay style="display:none;"></video>
                <canvas id="c1" width="320" height="240"></canvas>
            </div>

            <div style="text-align: center;">
                <h3>Tuvastatud ruudustik:</h3>
                <div class="board">
                    <div class="cell" id="cell-0"></div>
                    <div class="cell" id="cell-1"></div>
                    <div class="cell" id="cell-2"></div>
                    <div class="cell" id="cell-3"></div>
                    <div class="cell" id="cell-4"></div>
                    <div class="cell" id="cell-5"></div>
                    <div class="cell" id="cell-6"></div>
                    <div class="cell" id="cell-7"></div>
                    <div class="cell" id="cell-8"></div>
                </div>
                
                <br>
                <button onclick="sendDataToServer()">Saada andmed serverisse</button>
                <div id="server-status" class="status"></div>
            </div>
        </div>
    </div>
</body>
</html>
